# Integração contínua: a cada push e pull request, o GitHub roda os testes da API.
name: CI

on:
  push:
  pull_request:

jobs:
  api:
    name: API (pytest + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oasis
          POSTGRES_PASSWORD: oasis_dev
          POSTGRES_DB: oasis_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oasis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: pytest -v
